name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 【核心】Python 3.8 = 最后一个支持 Windows 7 的版本
      # 自带运行时含 api-ms-win-core-path-l1-1-0.dll，Win7/10/11 通吃
      - name: 安装 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: 显示环境信息
        run: |
          python --version
          python -c "import sys; print('Executable:', sys.executable)"
        shell: cmd

      # PyInstaller 5.x（兼容 py3.8）+ OpenCV（帧级查重）
      # 用 headless 版：体积更小，避免 GUI 依赖冲突
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==5.13.2"
          python -m pip install "opencv-python-headless==4.8.1.78"
          python -m pip install "numpy==1.24.4"
        shell: cmd

      # 打包。用 PowerShell 数组传参，避免 cmd 续行符 ^ 的坑
      - name: 打包成单文件 EXE
        shell: pwsh
        run: |
          $args = @(
            '--noconfirm', '--clean', '--onefile', '--windowed',
            '--name', 'VideoDedup',
            '--collect-all', 'cv2',
            '--exclude-module', 'matplotlib',
            '--exclude-module', 'PyQt5',
            '--exclude-module', 'PySide2',
            '--exclude-module', 'scipy',
            '--exclude-module', 'pandas',
            '--exclude-module', 'IPython',
            '--exclude-module', 'notebook',
            'video_dedup_gui.py'
          )
          python -m PyInstaller @args

      - name: 校验产物确实生成了
        shell: cmd
        run: |
          dir dist
          if not exist "dist\VideoDedup.exe" (
            echo [ERROR] exe was not generated!
            exit /b 1
          )
          echo [OK] exe generated successfully

      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: VideoDedup-windows
          path: dist/VideoDedup.exe

      - name: 附加到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoDedup.exe
